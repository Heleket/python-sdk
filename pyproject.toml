[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "heleket-sdk"
version = "0.4.0"
description = "Reference Python SDK for the Heleket cryptocurrency payment API: payments, payouts, balance, exchange rates, and signed webhooks."
authors = ["Heleket Reference SDK Authors"]
license = "MIT"
readme = "README.md"
homepage = "https://heleket.hk"
repository = "https://github.com/Heleket/python-sdk"
documentation = "https://doc.heleket.hk/"
keywords = ["heleket", "crypto", "cryptocurrency", "payments", "payouts", "sdk", "api", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
packages = [{ include = "heleket_sdk", from = "src" }]
include = [
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "UPGRADING.md", format = "sdist" },
]

[tool.poetry.urls]
Changelog = "https://github.com/Heleket/python-sdk/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Heleket/python-sdk/issues"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5"
requests = "^2.31"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.5"
mypy = "^1.10"
types-requests = "^2.31"

[tool.poetry.scripts]
heleket-webhook-inspect = "heleket_sdk._cli:main"

# ---------- ruff ----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "bin"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "PL",  # pylint subset
  "SIM", # simplifications
]
ignore = [
  "PLR0913", # too many arguments — DTO constructors are intentionally wide
  "PLR2004", # magic numbers — fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
"examples/*" = ["T201"]  # print() is the point in examples

[tool.ruff.format]
quote-style = "double"

# ---------- mypy ----------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/heleket_sdk"]

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = true
warn_required_dynamic_aliases = true

# ---------- pytest --------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
